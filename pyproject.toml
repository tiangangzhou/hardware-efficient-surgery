[project]
name = "hardware-efficient-surgery"
version = "1.0.0"
description = "Code and data for 'Parallel algebraic surgery for qLDPC codes with constant shuttling depth'"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Tian-Gang Zhou" },
    { name = "Boren Gu" },
    { name = "Jens Eisert" },
    { name = "Chen Zhao" },
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "galois>=0.4.2",
    "networkx>=3.0",
    "ldpc>=2.4.1",
    "stim>=1.16",
    "sinter>=1.16",
    "qldpc[relay-bp]>=0.4.1",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/algebraic_qec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = ["slow: long-running test (deselect with -m 'not slow')"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "I"]
ignore = ["E501", "E402", "E731", "E741", "B905", "B023"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E702", "F841", "B023"]
